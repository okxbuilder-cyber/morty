<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研发 Demo · PM × AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f14;
    color: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #f3f4f6;
    margin-bottom: 6px;
  }
  .header .subtitle {
    font-size: 13px;
    color: #6b7280;
  }
  .video-wrap {
    width: 100%;
    max-width: 960px;
    background: #161b27;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  }
  video {
    width: 100%;
    display: block;
    outline: none;
  }
  .back-btn {
    margin-top: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #6b7280;
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-btn:hover { color: #d1d5db; }
</style>
</head>
<body>
  <div class="header">
    <h1>⚡ 研发 Demo</h1>
    <p class="subtitle">PM × AI · 交付阶段 ⑥</p>
  </div>

  <div class="video-wrap">
    <video controls autoplay muted playsinline preload="metadata">
      <source src="research-demo.mp4" type="video/mp4">
      您的浏览器不支持 HTML5 视频播放。
    </video>
  </div>

  <a href="index.html" class="back-btn">← 返回主页</a>
</body>
</html>
