<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研发 Demo · PM × AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f14;
    color: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .header { text-align: center; flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 700; color: #f3f4f6; }
  .header .subtitle { font-size: 11px; color: #6b7280; margin-top: 2px; }

  /* 540×960 竖屏，限宽 300px → 高约 533px，MacBook 一屏放下 */
  .video-wrap {
    flex-shrink: 0;
    width: 300px;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  }
  video {
    width: 100%;
    height: auto;
    max-height: calc(100vh - 120px);
    display: block;
  }

  .back-btn {
    flex-shrink: 0;
    font-size: 11px;
    color: #4b5563;
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-btn:hover { color: #9ca3af; }
</style>
</head>
<body>
  <div class="header">
    <h1>⚡ 研发 Demo</h1>
    <p class="subtitle">PM × AI · 交付阶段 ⑥</p>
  </div>

  <div class="video-wrap">
    <video controls autoplay muted playsinline preload="metadata">
      <source src="research-demo.mp4" type="video/mp4">
    </video>
  </div>

  <a href="index.html" class="back-btn">← 返回主页</a>
</body>
</html>
